# rspamd-threat-multimap: add to $LOCAL_CONFDIR/local.d/multimap.conf.
#
# One rule per category, each reading that category's map (<category>.map:
# a domain per line, written by rspamd-threat-multimap). The
# threat_domains selector (lua.local.d/selectors/threat_domains.lua) gives
# each rule every URL host in the message with its parent domains, and the
# sender domains. The matched name is the symbol's option. rspamd re-reads
# a map when the updater replaces it.
#
# one_shot: ten listed links score once. group threat_multimap caps the
# rules together (local.d/groups.conf). For reference, rspamd's own
# PHISHED_OPENPHISH and PHISHED_PHISHTANK score 7.
#
# To score URL and sender hits apart, copy a rule with
# selector = "threat_domains('urls')" or "threat_domains('senders')": each
# rule holds its own copy of its map.

THREAT_MALWARE {
  type = "selector";
  selector = "threat_domains";
  map = "file:///var/lib/rspamd/threat-multimap/malware.map";
  score = 8.0;
  flags = "one_shot";
  group = "threat_multimap";
  description = "Malware distribution or C2 domain (rspamd-threat-multimap)";
}

THREAT_PHISHING {
  type = "selector";
  selector = "threat_domains";
  map = "file:///var/lib/rspamd/threat-multimap/phishing.map";
  score = 7.0;
  flags = "one_shot";
  group = "threat_multimap";
  description = "Phishing domain (rspamd-threat-multimap)";
}

# Its feeds are off by default (config.example.toml): the map stays empty
THREAT_FRAUD {
  type = "selector";
  selector = "threat_domains";
  map = "file:///var/lib/rspamd/threat-multimap/fraud.map";
  score = 4.0;
  flags = "one_shot";
  group = "threat_multimap";
  description = "Fake shop or scam domain (rspamd-threat-multimap)";
}
