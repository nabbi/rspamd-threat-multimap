# rspamd-threat-multimap: add to $LOCAL_CONFDIR/local.d/multimap.conf.
#
# One rule, one map: threat.map holds "domain SYMBOL" lines written by
# rspamd-threat-multimap, and the threat_domains selector
# (lua.local.d/selectors/threat_domains.lua) gives it every URL host in the
# message with its parent domains, and the sender domains. The map value
# picks the symbol; the matched name is the symbol's option. rspamd
# re-reads the file when the updater replaces it.
#
# Scores: local.d/groups.conf (group threat_multimap). For URL and sender
# hits under different symbols, use two rules with
# selector = "threat_domains('urls')" and "threat_domains('senders')":
# each rule loads its own copy of the map.

THREAT_DOMAIN {
  type = "selector";
  selector = "threat_domains";
  map = "file:///var/lib/rspamd/threat-multimap/threat.map";
  symbols = ["THREAT_MALWARE", "THREAT_PHISHING", "THREAT_FRAUD"];
  # Only if the map names a symbol not listed above
  score = 0.0;
  description = "Message points at a domain on a threat feed (rspamd-threat-multimap)";
}
