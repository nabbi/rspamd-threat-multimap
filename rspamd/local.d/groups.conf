# rspamd-threat-multimap: add to $LOCAL_CONFDIR/local.d/groups.conf.
#
# one_shot: a message with ten listed links scores once per symbol; the
# options still name every matched domain. For reference, rspamd's own
# PHISHED_OPENPHISH and PHISHED_PHISHTANK score 7.

group "threat_multimap" {
  description = "Domains on threat feeds (rspamd-threat-multimap)";
  max_score = 12.0;

  symbols {
    "THREAT_MALWARE" {
      weight = 8.0;
      one_shot = true;
      description = "Malware distribution or C2 domain (URLhaus, Infoblox, ransomware)";
    }
    "THREAT_PHISHING" {
      weight = 7.0;
      one_shot = true;
      description = "Phishing domain (OpenPhish, PhishTank, CERT Polska, Infoblox)";
    }
    "THREAT_FRAUD" {
      weight = 4.0;
      one_shot = true;
      description = "Fake shop or scam domain (feeds off by default)";
    }
    "THREAT_DOMAIN" {
      weight = 0.0;
      description = "Threat map entry with an unknown symbol";
    }
  }
}
