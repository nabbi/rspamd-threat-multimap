# rspamd-threat-multimap: add to $LOCAL_CONFDIR/local.d/groups.conf.
#
# The THREAT_* rules (local.d/multimap.conf) together score at most this
# much: a domain on both a phishing and a malware feed is one threat.

group "threat_multimap" {
  description = "Domains on threat feeds (rspamd-threat-multimap)";
  max_score = 12.0;
}
